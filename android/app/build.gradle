plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.phonecam'
    compileSdk 36

    testOptions {
        unitTests.returnDefaultValues = true
    }

    defaultConfig {
        applicationId 'com.phonecam'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables { useSupportLibrary = true }
        
        // Supported ABIs. Native ELF alignment is verified on the final bundle.
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
        
        // Developer/Vendor name
        manifestPlaceholders = [
            appDeveloper: 'ScSyn'
        ]
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release signing is supplied by the distributor; never use the debug key.
            
            // Retain native symbols for diagnostics
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            debuggable = true
            
            // Retain native symbols for diagnostics for debug builds too
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    // Model assets are stored without compression
    androidResources {
        noCompress 'tflite'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures { viewBinding = true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'

    // RTSP camera server. RootEncoder handles MediaCodec, RTP packetization,
    // RTSP-over-TCP serving, and camera lifecycle details for the MVP.
    implementation 'com.github.pedroSG94.RootEncoder:library:2.4.5'
    implementation 'com.github.pedroSG94:RTSP-Server:1.3.4'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
}
 
